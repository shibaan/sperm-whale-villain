<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" font-family="Segoe UI, Leelawadee UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2238"/>
      <stop offset="1" stop-color="#02060d"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16395a"/>
      <stop offset=".55" stop-color="#081a2c"/>
      <stop offset="1" stop-color="#02060d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#5fe3d0" stroke-opacity=".06"/>
    </pattern>
    <radialGradient id="eye"><stop offset="0" stop-color="#ffd0d7"/><stop offset=".35" stop-color="#ff2e4d"/><stop offset="1" stop-color="#ff2e4d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="640" fill="url(#bg)"/>
  <rect width="1200" height="640" fill="url(#grid)"/>

  <text x="40" y="58" fill="#5fe3d0" font-size="15" letter-spacing="4">CONCEPT 01 · SCALE STUDY</text>
  <text x="40" y="92" fill="#dce8f2" font-size="28" font-weight="700">MORVATH vs. HUMAN DIVER</text>

  <!-- length arrow -->
  <g stroke="#5fe3d0" stroke-opacity=".7" fill="#5fe3d0">
    <path d="M131 150H1091" stroke-dasharray="6 6"/>
    <path d="M131 150l12 -6v12z M1091 150l-12 -6v12z" stroke="none"/>
  </g>
  <text x="611" y="138" fill="#dce8f2" font-size="20" text-anchor="middle" font-weight="700">24 m</text>

  <!-- whale: 1 m = 40 px -->
  <g transform="translate(80 120) scale(1.696)">
    <path fill="url(#body)" stroke="#5fe3d0" stroke-opacity=".4" stroke-width=".8" d="M30 72 C30 46, 60 34, 124 34 L300 40 C380 46, 450 70, 500 94 L536 104 C556 80, 574 60, 596 48 C588 78, 576 98, 564 112 C578 126, 588 146, 596 172 C572 158, 554 138, 536 120 L500 126 C440 152, 360 166, 270 166 C200 166, 150 156, 112 140 L58 134 C44 133, 38 130, 42 126 L96 120 C58 114, 30 100, 30 72 Z"/>
    <path d="M190 150 C200 172, 222 186, 246 188 C232 176, 222 162, 218 150 Z" fill="#06121f" stroke="#5fe3d0" stroke-opacity=".25"/>
    <g stroke="#d9d2c3" stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round">
      <path d="M220 60l26 18M250 54l18 20M300 62l30 12M330 90l22 -6M270 110l34 6M380 78l20 10M410 98l18 -4"/>
    </g>
    <circle cx="132" cy="104" r="14" fill="url(#eye)"/>
    <circle cx="132" cy="104" r="2.6" fill="#ffe3e7"/>
  </g>

  <!-- human diver 1.8 m = 72 px -->
  <g fill="#d9d2c3">
    <circle cx="1141" cy="436" r="8"/>
    <path d="M1132 446h18l3 30h-5l-2 24h-4l-1 -21h-2l-1 21h-4l-2 -24h-5z"/>
  </g>
  <g stroke="#ff2e4d" fill="none">
    <path d="M1166 428V500M1160 428h12M1160 500h12"/>
  </g>
  <text x="1172" y="470" fill="#ff8095" font-size="14" transform="rotate(-90 1172 470)" text-anchor="middle">1.8 m</text>

  <!-- ruler -->
  <g stroke="#8aa1b5" stroke-opacity=".7">
    <path d="M131 520H1091"/>
    <path d="M131 520v12M211 520v6M291 520v12M371 520v6M451 520v12M531 520v6M611 520v12M691 520v6M771 520v12M851 520v6M931 520v12M1011 520v6M1091 520v12"/>
  </g>
  <g fill="#8aa1b5" font-size="13" text-anchor="middle">
    <text x="131" y="552">0</text><text x="291" y="552">4 m</text><text x="451" y="552">8 m</text>
    <text x="611" y="552">12 m</text><text x="771" y="552">16 m</text><text x="931" y="552">20 m</text><text x="1091" y="552">24 m</text>
  </g>

  <text x="40" y="604" fill="#8aa1b5" font-size="15">65 t · head ≈ 1/3 of body length · 13× taller than a diver</text>
</svg>
